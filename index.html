<!DOCTYPE HTML>
<html lang="fi" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Voting site</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="#">
                <p id="logo">Voting site<p>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

             <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav" id="navbar">
                    <li>
                        <button id="register" class="logbtn"
                                data-bs-toggle="collapse"
                                data-bs-target="#registerpanel"
                                onclick="closeOther('loginpanel')">
                            Rekisteröidy
                        </button>
                    </li>
                    <li>
                        <button id="login" class="logbtn"
                                data-bs-toggle="collapse"
                                data-bs-target="#loginpanel"
                                onclick="closeOther('registerpanel')">
                            Kirjaudu sisään
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="collapse" id="registerpanel">
            <div class="container py-3" id="panel1">
                <p>Rekisteröityminen</p>
                <label for="regusername">Käyttäjänimi: </label><br>
                <input type="text" id="regusername"><br>
                <p id="regUserError" class="error"></p>
                <label for="regpasswrd">Salasana: </label><br>
                <input type="password" id="regpasswrd"><br>
                <p id="regPasswdError" class="error"></p>
                <p id="regSucc" class="succ"></p>
                <input type="checkbox" id="admin">
                <label for="admin">Ylläpitäjä?</label>
                <button id="sendregister" class="sendbtn">rekisteröidy</button>
            </div>
        </div>
        <div class="collapse" id="loginpanel">
            <div class="container py-3" id="panel2">
                <p>Kirjautuminen</p>
                <label for="logusername">Käyttäjänimi: </label><br>
                <input type="text" id="logusername"><br>
                <p id="logUserError" class="error"></p>
                <label for="logpasswrd">Salasana: </label><br>
                <input type="password" id="logpasswrd">
                <p id="logPasswdError" class="error"></p>
                <p id="logSucc" class="succ"></p>
                <button id="sendlogin" class="sendbtn">Kirjaudu sisään</button>
            </div>
        </div>
        <div id="polls">
            <p id="logrem">Kirjaudu sisään nähdäksesi äänestykset!</p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
        <script src="main.js"></script>
    </body>
</html>
